# KitchenTableAI orchestrator. SPDX-License-Identifier: AGPL-3.0-only
#
# This file is measured. Tinfoil hashes it into the enclave's kernel command line
# (tinfoil-config-hash=... in the published tinfoil-deployment.json), so the image digest,
# the environment values, the secret names and the egress allowlist below are all covered
# by the attestation a client checks. It must live in a PUBLIC GitHub repository.
#
# Placeholders to fill before the first release: OWNER and the image digest. The digest
# comes from the Build Image workflow summary (or scripts/build-image.mjs locally).
#
# 0.14.15 is the CVM version Tinfoil's own production containers used on 2026-10-23
# (confidential-websearch, confidential-pii-cpu). 0.14.16 was the newest release that day.
cvm-version: 0.14.15
cpus: 2
memory: 8192

networks:
  # The only host the container may reach is the inference API, for the chat model and the
  # judge alike. There is deliberately no entry for our own control plane yet: in this build the
  # family's device sends the Agreement with each turn, and the signed envelope goes back to the
  # device, not to a server of ours.
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh

containers:
  - name: "orchestrator"
    # Replace the all-zero digest with the real one. A tag alone is rejected.
    image: "ghcr.io/tbwest-ai/kitchentableai-orchestrator@sha256:f1b6a5db5b8ccce4276440cfb951ff6a3c87a6719c424527ed14aebc8e48d39b"
    networks: [inference]
    env:
      - PORT: "8080"
      - INFERENCE_URL: "https://inference.tinfoil.sh/v1/chat/completions"
      # Which model answers each age band, and which judges a kid's turn, live in
      # policy/model-policy.json inside the image (GLM 5.3 for every band at "low", its floor;
      # gpt-oss-safeguard-120b as the judge, 3 s timeout, one retry, give up at 6 s).
      #
      # The spike's connectivity check (/turn with { "prompt": "..." }, a raw model call outside
      # the floor) is off from v0.3.0, when the founder's family starts using this instance: every
      # model call now goes through the Agreement, the floor and the judge. The browser check page
      # sends a turn for the synthetic sample family instead.
      - CONNECTIVITY_TURN: "off"
      # The lock (TURN.md, "The lock"), on from v0.5.1. Only a device with a pass signed by the
      # family app's server runs a turn or reads a page; this is that server's Ed25519 public key
      # (base64url; comma-separated when there are more, as when the key is changed). The private
      # half lives only in the family app's server settings. The synthetic sample family needs no
      # pass. /health reports the mode ("passes") and how many keys, so a verifier sees it.
      - ACCESS_PUBLIC_KEYS: "QzO0H6W5qFIb_Ged9gRxDOnUrWpLAEpiZe9kcMTGdks"
    secrets:
      # Both are Tinfoil-managed secrets, created with `tinfoil secret create` (README step 7).
      # TINFOIL_API_KEY: the inference key.
      # SIGNING_KEY_PEM: an Ed25519 private key (PKCS#8 PEM) the service signs replies with
      #   while attested keys are in beta. Exit test 3's fallback path.
      - TINFOIL_API_KEY
      - SIGNING_KEY_PEM
    # Exit test 3's preferred path. Beta: attested keys need V3 attestation, and on
    # 2026-10-23 the JavaScript SDK (tinfoil@1.3.0) verified only the v1/v2 predicate
    # formats. So: pass exit tests 1 and 2 first with this block commented out, then
    # uncomment both `keys:` and `attested-keys:`, release a new tag, update the instance
    # and run the browser check again. If the browser then fails, that is a finding.
    keys: [turn-signing]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

attested-keys:
  - id: turn-signing
    key: ed25519
    # The image runs as the official node image's `node` user (uid 1000, gid 1000). Without
    # these, private_key.pem is root-owned mode 0600 and the service cannot read it: v0.1.1
    # booted to "unhealthy" on 2026-11-02 for exactly that reason.
    uid: 1000
    gid: 1000
# The service reads /run/tinfoil/keys/turn-signing/private_key.pem when it exists and reports
# key_source "attested-key"; otherwise it falls back to SIGNING_KEY_PEM ("managed-secret").

shim:
  upstream-port: 8080
  paths:
    - /health
    - /turn
    - /page
    - /pubkey
  # `origins` is left unset so the test pages (web/index.html, web/chat.html) can be served
  # from localhost. Production sets it to the app's origin.
